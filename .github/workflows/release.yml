name: Release desktop application

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Tag a verified main release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - id: release
        name: Create a tag only for a new version
        run: |
          version="$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")"
          test "$version" = "$(node -p "require('./frontend/package.json').version")"
          release_tag="v$version"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "## CD skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Version $release_tag is already released or being released." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$release_tag" "$GITHUB_SHA" -m "Floatcraft $release_tag"
          git push origin "$release_tag"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify protected stable tag
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Require a tag commit reachable from protected main
        run: |
          git fetch origin main --tags
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Require tag and manifests to describe the same release version
        run: |
          version="$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")"
          test "$RELEASE_TAG" = "v$version"
          test "$version" = "$(node -p "require('./frontend/package.json').version")"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run release checks
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path frontend/src-tauri/Cargo.toml -- --check
          cargo test --locked
          npm --prefix frontend test
          npm --prefix frontend run build

  upload:
    name: Build and sign (${{ matrix.name }})
    needs: [prepare, verify]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    environment: release
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,updater
          - name: Windows x64
            runner: windows-latest
            target: ''
            bundles: nsis
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ needs.prepare.outputs.release_tag }}
          releaseName: Floatcraft ${{ needs.prepare.outputs.release_tag }}
          releaseBody: Signed stable installers for macOS ARM and Windows x64.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

  publish:
    name: Publish verified stable release
    needs: [prepare, upload]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    permissions:
      contents: write
    steps:
      - name: Require updater artifacts for both supported platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest_dir="$RUNNER_TEMP/floatcraft-release"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$manifest_dir"
          node -e '
            const manifest = require(process.argv[1]);
            for (const platform of ["darwin-aarch64", "windows-x86_64-nsis"]) {
              if (!manifest.platforms?.[platform]?.url || !manifest.platforms?.[platform]?.signature) {
                throw new Error("Missing signed updater entry for " + platform);
              }
            }
          ' "$manifest_dir/latest.json"

      - name: Publish the complete draft atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Write published release summary
        run: |
          {
            echo "## Floatcraft $RELEASE_TAG published"
            echo "- macOS ARM DMG and signed updater: ready"
            echo "- Windows x64 NSIS installer and signed updater: ready"
            echo "- [Open GitHub Release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
