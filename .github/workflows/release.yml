name: Release desktop application

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: Windows x64
            runner: windows-latest
            target: ''
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Re-run release checks
        run: |
          cargo test --locked
          npm --prefix frontend test
          cargo test --manifest-path frontend/src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: v__VERSION__
          releaseName: Floatcraft v__VERSION__
          releaseBody: Signed public-beta installers for macOS ARM and Windows x64.
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
