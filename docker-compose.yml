services:
  api:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      SYNC_DATA_DIR: /app/runtime
      CATALOG_SYNC_INTERVAL_SECS: 86400
    volumes:
      - ./runtime:/app/runtime

  web:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - api
    ports:
      - "5173:5173"
