[package]
name = "cs-float-planner"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.1"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "net", "fs", "time", "sync"] }
tower-http = { version = "0.6.2", features = ["cors", "trace"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
